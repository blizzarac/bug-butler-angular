<header class="topbar">
  <div class="logo"><i></i>Ledgerline</div>
  <span class="env-ribbon">STAGING</span>
  <div class="spacer"></div>
  @if (bugButler.enabled) {
    <button type="button" class="ghost" (click)="bugButler.open()">Report a bug</button>
  }
  <div class="avatar">QA</div>
</header>
<div class="shell">

    <a routerLink="/invoices" routerLinkActive="active">Invoices</a>

  </nav>
  <main>
    <router-outlet />
  </main>
</div>
